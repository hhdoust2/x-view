<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایش توئیت‌ها</title>
    <style>
        :root {
            --bg-color: #0f1419;
            --card-bg: #161e27;
            --card-border: #2f3336;
            --accent-color: #1d9bf0;
            --accent-hover: #1a8cd8;
            --text-main: #e7e9ea;
            --text-sub: #71767b;
            --danger: #f4212e;
            --success: #00ba7c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 650px;
            margin: auto;
            direction: rtl;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
        }

        header h1 {
            font-size: 18px;
            color: var(--accent-color);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .api-link {
            font-size: 12px;
            color: var(--text-sub);
            text-decoration: none;
            background: rgba(29, 155, 240, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(29, 155, 240, 0.3);
            transition: 0.2s;
        }
        .api-link:hover { background: rgba(29, 155, 240, 0.2); }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        @media (max-width: 500px) {
            .controls-grid { grid-template-columns: 1fr; }
        }

        .compact-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header-sm {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--card-border);
            background-color: #000000;
            color: var(--text-main);
            border-radius: 8px;
            font-size: 13px;
            direction: ltr;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn-sm {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .btn-sm:hover { background-color: var(--accent-hover); }

        .users-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            max-height: 60px;
            overflow-y: auto;
        }

        .chip {
            background: rgba(239, 243, 244, 0.08);
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 2px 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            direction: ltr;
            transition: 0.2s;
        }

        .chip:hover {
            border-color: var(--accent-color);
            background: rgba(29, 155, 240, 0.1);
        }

        .chip-name {
            cursor: pointer;
            color: var(--text-main);
            font-weight: 500;
        }

        .chip-del {
            cursor: pointer;
            color: var(--text-sub);
            font-size: 11px;
            line-height: 1;
            padding: 2px;
            border-radius: 50%;
        }

        .chip-del:hover { color: var(--danger); }

        .tweet-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .tweet-card:hover {
            border-color: rgba(239, 243, 244, 0.2);
        }

        .tweet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .tweet-user {
            font-weight: bold;
            color: var(--text-main);
            font-size: 14px;
            direction: ltr;
        }

        .tweet-date {
            font-size: 11px;
            color: var(--text-sub);
            direction: ltr;
        }

        .tweet-text {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-main);
            white-space: pre-wrap;
            word-wrap: break-word;
            direction: auto;
            text-align: initial;
            margin-bottom: 10px;
        }

        .tweet-stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-sub);
            border-top: 1px solid var(--card-border);
            padding-top: 8px;
            direction: ltr;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #loading {
            text-align: center;
            color: var(--text-sub);
            padding: 20px;
            font-size: 13px;
        }

        .debug-box {
            background: #1e1010;
            border: 1px solid var(--danger);
            color: #ffb3b3;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            نمایش توئیت‌ها
        </h1>
        <a class="api-link" href="https://twitterapi.io/" target="_blank">🔑 دریافت API Key</a>
    </header>

    <div class="controls-grid">
        <div class="compact-card">
            <div class="card-header-sm">
                <span>کلید API</span>
                <span id="saveStatus" style="color:var(--success);"></span>
            </div>
            <div class="input-group">
                <input type="text" id="apiKey" placeholder="Paste API Key...">
                <button class="btn-sm" onclick="saveApiKey()">ذخیره</button>
            </div>
        </div>

        <div class="compact-card">
            <div class="card-header-sm">
                <span>مدیریت کاربران (حداکثر ۵)</span>
            </div>
            <div class="input-group">
                <input type="text" id="username" placeholder="Username (بدون @)">
                <button class="btn-sm" onclick="addSavedUser()">+ افزودن</button>
            </div>
            <div id="usersList" class="users-chips"></div>
        </div>
    </div>

    <div id="tweetsContainer"></div>

    <script>
        const WORKER_URL = "https://xreverse.elabela.workers.dev";

        window.onload = function() {
            const savedKey = localStorage.getItem('twitter_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
            renderUsers();
        };

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (!key) return alert('لطفاً کلید را وارد کنید.');
            
            localStorage.setItem('twitter_api_key', key);
            const status = document.getElementById('saveStatus');
            status.innerText = '✔ ذخیره شد';
            setTimeout(() => status.innerText = '', 2500);
        }

        // ذخیره کاربران به صورت شیء { username, id }
        function getSavedUsers() {
            return JSON.parse(localStorage.getItem('saved_twitter_users_v2') || '[]');
        }

        function renderUsers() {
            const users = getSavedUsers();
            const listContainer = document.getElementById('usersList');
            listContainer.innerHTML = '';

            if (users.length === 0) {
                listContainer.innerHTML = '<span style="font-size:11px; color:var(--text-sub); padding-top:4px;">کاربری اضافه نشده است.</span>';
                return;
            }

            users.forEach((usrObj, index) => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerHTML = `
                    <span class="chip-name" onclick="getTweets('${usrObj.username}')">@${usrObj.username}</span>
                    <span class="chip-del" onclick="deleteUser(${index})" title="حذف">✕</span>
                `;
                listContainer.appendChild(chip);
            });
        }

        async function addSavedUser() {
            const input = document.getElementById('username');
            const username = input.value.trim().replace('@', '');

            if (!username) return alert('نام کاربری را وارد کنید.');

            let users = getSavedUsers();
            if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                return alert('این کاربر موجود است.');
            }
            if (users.length >= 5) return alert('سقف ۵ کاربر پر شده است.');

            // موقع اضافه کردن، یک بار id دریافت می‌شود
            const userId = await fetchUserId(username);
            if (!userId) return; // در صورت بروز خطا پیامی نشان داده می‌شود

            users.push({ username, id: userId });
            localStorage.setItem('saved_twitter_users_v2', JSON.stringify(users));
            input.value = '';
            renderUsers();
            getTweets(username);
        }

        function deleteUser(index) {
            let users = getSavedUsers();
            users.splice(index, 1);
            localStorage.setItem('saved_twitter_users_v2', JSON.stringify(users));
            renderUsers();
        }

        // تابع دریافت آیدی که فقط زمان ثبت اولیه کاربر اجرا می‌شود
        async function fetchUserId(username) {
            const apiKey = localStorage.getItem('twitter_api_key') || document.getElementById('apiKey').value.trim();
            const container = document.getElementById('tweetsContainer');

            if (!apiKey) {
                alert('لطفاً ابتدا API Key را وارد و ذخیره کنید.');
                return null;
            }

            container.innerHTML = `<div id="loading">در حال ثبت کاربر و استخراج ID برای @${username}...</div>`;

            try {
                const targetInfoUrl = `https://api.twitterapi.io/twitter/user/info?userName=${encodeURIComponent(username)}`;
                const infoUrl = `${WORKER_URL}/?url=${encodeURIComponent(targetInfoUrl)}`;
                
                const infoRes = await fetch(infoUrl, { 
                    method: 'GET',
                    headers: { 'x-api-key': apiKey } 
                });

                const infoText = await infoRes.text();
                let infoData;
                try { infoData = JSON.parse(infoText); } catch(e) { throw new Error("پاسخ JSON معتبر نیست:\n" + infoText); }

                if (!infoRes.ok) {
                    throw new Error(`خطای HTTP ${infoRes.status}:\n` + JSON.stringify(infoData, null, 2));
                }

                const userId = infoData.data?.id_str || infoData.data?.id || infoData.user?.id_str || infoData.id;

                if (!userId) {
                    throw new Error("شناسه کاربر یافت نشد:\n" + JSON.stringify(infoData, null, 2));
                }

                return userId;

            } catch (error) {
                container.innerHTML = `
                    <div id="loading" style="color:var(--danger)">خطا در ثبت کاربر!</div>
                    <div class="debug-box">${escapeHtml(error.message)}</div>
                `;
                return null;
            }
        }

        async function getTweets(targetUsername) {
            const apiKey = localStorage.getItem('twitter_api_key') || document.getElementById('apiKey').value.trim();
            const container = document.getElementById('tweetsContainer');

            if (!apiKey) return alert('لطفاً ابتدا API Key را وارد و ذخیره کنید.');

            let users = getSavedUsers();
            let userObj = users.find(u => u.username.toLowerCase() === targetUsername.toLowerCase());

            let userId = userObj?.id;

            // اگر کاربر قبلا ذخیره نشده باشد، اول آیدی گرفته می‌شود
            if (!userId) {
                userId = await fetchUserId(targetUsername);
                if (!userId) return;
            }

            container.innerHTML = `<div id="loading">در حال بارگذاری سریع پست‌های @${targetUsername}...</div>`;

            try {
                // درخواست آنی برای گرفتن پست‌ها با استفاده از ID ذخیره شده
                const targetTimelineUrl = `https://api.twitterapi.io/twitter/user/tweet_timeline?userId=${userId}`;
                const timelineUrl = `${WORKER_URL}/?url=${encodeURIComponent(targetTimelineUrl)}`;
                
                const timelineRes = await fetch(timelineUrl, { 
                    method: 'GET',
                    headers: { 'x-api-key': apiKey } 
                });

                const timelineText = await timelineRes.text();
                let timelineData;
                try { timelineData = JSON.parse(timelineText); } catch(e) { throw new Error("پاسخ تایم‌لاین معتبر نیست:\n" + timelineText); }

                if (!timelineRes.ok) {
                    throw new Error(`خطای تایم‌لاین HTTP ${timelineRes.status}:\n` + JSON.stringify(timelineData, null, 2));
                }

                const tweets = timelineData.data?.tweets || timelineData.tweets || timelineData.data || [];

                if (!Array.isArray(tweets) || tweets.length === 0) {
                    container.innerHTML = `<div id="loading">پستی برای نمایش وجود ندارد.</div>`;
                    return;
                }

                container.innerHTML = '';

                tweets.forEach(tweet => {
                    const tweetText = tweet.text || tweet.full_text || '';
                    
                    let formattedDate = '';
                    if (tweet.createdAt) {
                        const d = new Date(tweet.createdAt);
                        formattedDate = isNaN(d) ? tweet.createdAt : d.toLocaleString('fa-IR');
                    }

                    const likes = tweet.likeCount?.toLocaleString() ?? 0;
                    const retweets = tweet.retweetCount?.toLocaleString() ?? 0;
                    const replies = tweet.replyCount?.toLocaleString() ?? 0;
                    const views = tweet.viewCount?.toLocaleString() ?? 0;
                    const bookmarks = tweet.bookmarkCount?.toLocaleString() ?? 0;

                    const tweetHTML = `
                        <div class="tweet-card">
                            <div class="tweet-header">
                                <span class="tweet-user">@${targetUsername}</span>
                                <span class="tweet-date">${formattedDate}</span>
                            </div>
                            <div class="tweet-text">${escapeHtml(tweetText)}</div>
                            <div class="tweet-stats">
                                <div class="stat-item" title="پاسخ">💬 ${replies}</div>
                                <div class="stat-item" title="بازنشر">🔁 ${retweets}</div>
                                <div class="stat-item" title="لایک">❤️ ${likes}</div>
                                <div class="stat-item" title="بازدید">👁️ ${views}</div>
                                <div class="stat-item" title="بوک‌مارک">🔖 ${bookmarks}</div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += tweetHTML;
                });

            } catch (error) {
                container.innerHTML = `
                    <div id="loading" style="color:var(--danger)">خطا در دریافت اطلاعات!</div>
                    <div class="debug-box">${escapeHtml(error.message)}</div>
                `;
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
